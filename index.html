<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hotel Management System</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="logo">🏨</div><h1>Hotel Management</h1><p>SPCK / Browser Edition</p>
    <label>Username</label><input id="loginUsername" value="admin" autocomplete="username">
    <label>Password</label><input id="loginPassword" value="admin123" type="password" autocomplete="current-password">
    <button class="primary full" id="loginBtn">Login</button>
    <button class="secondary full" id="resetDemo" style="margin-top:8px">Reset Demo Data</button>
    <div class="hint">Demo login: <b>admin / admin123</b></div>
  </div>
</div>
<div id="app" class="app hidden">
 <aside class="sidebar"><div class="brand">🏨 <span id="brandName">My Hotel</span></div><div id="nav"></div><button class="nav-btn logout" id="logoutBtn">↪ Logout</button></aside>
 <main class="main"><header class="topbar"><div><h2 id="pageTitle">Dashboard</h2><small id="today"></small></div><span id="saveState" class="save-state">Saved locally</span></header><section id="content"></section></main>
</div>
<div id="qrModal" class="modal-backdrop hidden"><div class="modal"><div id="qrModalContent"></div><div class="actions" style="justify-content:center"><button class="secondary" onclick="closeQRModal()">Close</button></div></div></div>
<script>
(function(){
'use strict';
const KEY='HOTEL_FINAL_V3_6';
const LEGACY_KEYS=['HOTEL_FINAL_V3_5','HOTEL_FINAL_V3_4','HOTEL_FINAL_V3_3','HOTEL_FINAL_V3_2'];
const API_BASE=localStorage.getItem('HOTEL_API_BASE')||((location.protocol==='http:'||location.protocol==='https:')&&location.hostname!=='run.spck.io'?location.origin:'');
const seed={
 settings:{name:'My Hotel',address:'',phone:'',gstin:'',gstRate:5,roomTaxRate:5,foodTaxRate:5,prefix:'INV',upiId:'',upiName:'',renewalUpiId:'9353689775@upi',renewalUpiName:'Hotel Renewal'},
 users:[{id:1,username:'admin',password:'admin123',role:'ADMIN'}],
 rooms:[
  {id:1,no:'101',floor:1,type:'Standard',price:1800,status:'AVAILABLE'},
  {id:2,no:'102',floor:1,type:'Standard',price:1800,status:'AVAILABLE'},
  {id:3,no:'103',floor:1,type:'Deluxe',price:2800,status:'AVAILABLE'},
  {id:4,no:'104',floor:1,type:'Deluxe',price:2800,status:'AVAILABLE'},
  {id:5,no:'201',floor:2,type:'Suite',price:4500,status:'AVAILABLE'},
  {id:6,no:'202',floor:2,type:'Suite',price:4500,status:'AVAILABLE'}
 ],
 guests:[],bookings:[],invoices:[],payments:[],menu:[
  {id:1,name:'Tea',category:'Beverage',price:50},{id:2,name:'Coffee',category:'Beverage',price:80},{id:3,name:'Veg Thali',category:'Main Course',price:220},{id:4,name:'Paneer Butter Masala',category:'Main Course',price:260}
 ],orders:[],expenses:[],renewalRequests:[],subscription:{status:'DEACTIVE',plan:'None',expiry:'',customerId:'HOTEL-DEMO',renewalUpiId:'9353689775@upi'}
};
let db=null,posCart=[];
const $=id=>document.getElementById(id), num=x=>Number(x||0), money=x=>'₹'+num(x).toFixed(2), today=()=>new Date().toISOString().slice(0,10), now=()=>new Date().toISOString();
const clone=x=>JSON.parse(JSON.stringify(x)), esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nextId=a=>a.length?Math.max(...a.map(x=>num(x.id)))+1:1;
const room=i=>db.rooms.find(x=>num(x.id)===num(i)), guest=i=>db.guests.find(x=>num(x.id)===num(i)), booking=i=>db.bookings.find(x=>num(x.id)===num(i)), invoice=i=>db.invoices.find(x=>num(x.id)===num(i));
const nights=(a,b)=>{if(!a||!b)return 0;const x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');return y>x?Math.ceil((y-x)/86400000):0};
const paymentsFor=bid=>db.payments.filter(x=>num(x.bookingId)===num(bid)&&x.source!=='RESTAURANT');
const paid=bid=>paymentsFor(bid).reduce((s,p)=>s+num(p.amount),0);
const foodTotal=bid=>db.orders.filter(o=>num(o.bookingId)===num(bid)&&o.status!=='VOID'&&o.chargeToRoom!==false&&o.paymentStatus!=='PAID').reduce((s,o)=>s+num(o.total),0);
function normalize(d){const f=clone(seed);if(!d||typeof d!=='object')d=f;Object.keys(f).forEach(k=>{if(d[k]===undefined)d[k]=clone(f[k])});['users','rooms','guests','bookings','invoices','payments','menu','orders','expenses','renewalRequests'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});d.orders.forEach(o=>{if(o.chargeToRoom===undefined)o.chargeToRoom=!!o.bookingId;if(o.paymentStatus===undefined)o.paymentStatus=o.chargeToRoom?'DUE':'PAID'});if(!d.users.some(u=>u.username==='admin'&&u.password==='admin123'))d.users.unshift({id:1,username:'admin',password:'admin123',role:'ADMIN'});if(!d.settings.upiId)d.settings.upiId='';if(!d.settings.renewalUpiId)d.settings.renewalUpiId='9353689775@upi';if(!d.settings.renewalMonthly)d.settings.renewalMonthly=299;if(!d.settings.renewalYearly)d.settings.renewalYearly=1999;if(!d.settings.renewalUpiName)d.settings.renewalUpiName='Hotel Renewal';if(!d.subscription.customerId)d.subscription.customerId='HOTEL-DEMO';if(!d.subscription.renewalUpiId)d.subscription.renewalUpiId=d.settings.renewalUpiId;return d}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw){for(const k of LEGACY_KEYS){raw=localStorage.getItem(k);if(raw)break}}return normalize(raw?JSON.parse(raw):null)}catch(e){return clone(seed)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));if($('saveState'))$('saveState').textContent='Saved locally'}catch(e){if($('saveState'))$('saveState').textContent='Storage error'}}
function field(i,l,t,v,req=true){return '<div class="field"><label class="'+(req?'required':'')+'">'+esc(l)+'</label><input id="'+i+'" type="'+(t||'text')+'" value="'+esc(v==null?'':v)+'" '+(req?'required':'')+'></div>'}
function selectField(i,l,opts,req=true){return '<div class="field"><label class="'+(req?'required':'')+'">'+esc(l)+'</label><select id="'+i+'" '+(req?'required':'')+'>'+opts+'</select></div>'}
function stat(l,v){return '<div class="stat"><div class="muted">'+esc(l)+'</div><div class="num">'+esc(v)+'</div></div>'}
function set(html){$('content').innerHTML=html}
function statusBadge(s){return '<span class="badge '+esc(s)+'">'+esc(s)+'</span>'}
const titles={dashboard:'Dashboard',rooms:'Rooms',bookings:'Bookings',guests:'Guests / KYC',billing:'Billing',restaurant:'Restaurant / POS',housekeeping:'Housekeeping',reports:'Reports',subscription:'Subscription',renewals:'Renewal Requests',settings:'Hotel Settings'};
const pages={};
function nav(){const items=[['dashboard','📊 Dashboard'],['rooms','🛏 Rooms'],['bookings','📅 Bookings'],['guests','👤 Guests / KYC'],['billing','🧾 Billing'],['restaurant','🍽 Restaurant / POS'],['housekeeping','🧹 Housekeeping'],['reports','📈 Reports'],['subscription','🔐 Subscription'],['renewals','🔔 Renewal Requests'],['settings','⚙ Hotel Settings']];$('nav').innerHTML=items.map(x=>'<button class="nav-btn" data-page="'+x[0]+'">'+x[1]+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page))}
function showPage(n){$('pageTitle').textContent=titles[n]||n;document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===n));pages[n]?pages[n]():set('<div class="empty">Module not found</div>')}
function applyLicenseGate(active){document.querySelectorAll('.nav-btn[data-page]').forEach(b=>{const allow=active||['dashboard','subscription','renewals','settings'].includes(b.dataset.page);b.disabled=!allow;b.style.opacity=allow?'1':'.45';b.title=allow?'': 'Subscription inactive — renew to use this module';});if(!active&&['rooms','bookings','guests','billing','restaurant','housekeeping','reports'].includes(Object.keys(titles).find(k=>titles[k]===$('pageTitle').textContent)||''))showPage('subscription')}
function start(){try{db=load();nav();$('brandName').textContent=db.settings.name||'My Hotel';$('logoutBtn').onclick=()=>location.reload();$('today').textContent=new Date().toLocaleString();setInterval(()=>$('today').textContent=new Date().toLocaleString(),1000);showPage('dashboard');if(localStorage.getItem('HOTEL_API_BASE')||API_BASE)checkLicenseNow(true);else applyLicenseGate(true)}catch(e){set('<div class="card"><h3>Load error</h3><pre>'+esc(e.stack||e)+'</pre></div>')}}
function doLogin(){const u=$('loginUsername').value.trim(),p=$('loginPassword').value;if(u!=='admin'||p!=='admin123')return alert('Username: admin | Password: admin123');$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');start()}
$('loginBtn').onclick=doLogin;$('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});$('resetDemo').onclick=()=>{if(confirm('Reset all local demo data?')){localStorage.removeItem(KEY);location.reload()}};

pages.dashboard=function(){const total=db.rooms.length,a=db.rooms.filter(r=>r.status==='AVAILABLE').length,o=db.rooms.filter(r=>r.status==='OCCUPIED').length,res=db.rooms.filter(r=>r.status==='RESERVED').length,dirty=db.rooms.filter(r=>r.status==='DIRTY').length;db.bookings.forEach(refreshInvoice);const rev=db.invoices.reduce((s,x)=>s+num(x.total),0),col=db.payments.reduce((s,x)=>s+num(x.amount),0),due=db.invoices.reduce((s,x)=>s+num(x.balance),0);set('<div class="grid">'+stat('Total Rooms',total)+stat('Available',a)+stat('Occupied',o)+stat('Reserved',res)+stat('Dirty',dirty)+stat('Invoice Value',money(rev))+stat('Collected',money(col))+stat('Outstanding',money(due))+'</div><br><div class="card"><h3>Automatic workflow</h3><div class="notice"><b>Guest/KYC Search → Available Room → Booking → Advance/Full Payment → Invoice → Check-in → Restaurant/Extras → Later Payment → Final Invoice → Check-out → Dirty → Cleaning → Available</b></div><p class="muted">Every payment remains linked to the same booking and invoice.</p></div><br><div class="card"><h3>Quick actions</h3><div class="actions"><button class="primary" onclick="showPage(\'bookings\')">New Booking</button><button onclick="showPage(\'billing\')">Billing / Payment</button><button onclick="showPage(\'restaurant\')">Restaurant POS</button></div></div>')};

pages.rooms=function(){const cards=db.rooms.map(r=>{const b=db.bookings.find(x=>num(x.roomId)===num(r.id)&&['RESERVED','CHECKED_IN'].includes(x.status));const g=b&&guest(b.guestId);return '<div class="room-card '+r.status+'"><h3>Room '+esc(r.no)+'</h3><div>'+esc(r.type)+' · Floor '+esc(r.floor)+'</div><p>'+money(r.price)+' / night</p>'+statusBadge(r.status)+(g?'<p><b>Guest:</b> '+esc(g.name)+'<br>'+esc(g.mobile)+'</p>':'')+'<div class="actions">'+(r.status==='DIRTY'?'<button class="warning" onclick="startCleaning('+r.id+')">Start Cleaning</button>':'')+(r.status==='CLEANING'?'<button class="success" onclick="finishCleaning('+r.id+')">Cleaning Done</button>':'')+'<button onclick="changeRoomStatus('+r.id+')">Status</button></div></div>'}).join('');set('<div class="form"><h3>Add Room</h3><div class="form-grid">'+field('rNo','Room No')+field('rFloor','Floor','number',1)+field('rType','Room Type','text','Standard')+field('rPrice','Price / Night','number',1800)+'</div><button class="primary" onclick="addRoom()">Add Room</button></div><div class="room-grid">'+cards+'</div>')};
function addRoom(){const no=$('rNo').value.trim();if(!no)return alert('Room number required');if(db.rooms.some(r=>r.no===no))return alert('Room already exists');db.rooms.push({id:nextId(db.rooms),no,floor:num($('rFloor').value)||1,type:$('rType').value||'Standard',price:num($('rPrice').value),status:'AVAILABLE'});save();pages.rooms()}
function changeRoomStatus(i){const r=room(i),s=prompt('AVAILABLE / RESERVED / OCCUPIED / DIRTY / CLEANING / MAINTENANCE',r.status);if(!s)return;const x=s.toUpperCase();if(!['AVAILABLE','RESERVED','OCCUPIED','DIRTY','CLEANING','MAINTENANCE'].includes(x))return alert('Invalid status');r.status=x;save();pages.rooms()}
function startCleaning(i){room(i).status='CLEANING';save();pages.housekeeping()}function finishCleaning(i){room(i).status='AVAILABLE';save();pages.housekeeping()}

function guestMatches(g,q){return [g.name,g.mobile,g.email,g.idType,g.idNo,g.address].join(' ').toLowerCase().includes((q||'').trim().toLowerCase())}
function guestRow(g){const count=db.bookings.filter(b=>num(b.guestId)===num(g.id)).length;return '<tr><td><b>'+esc(g.name)+'</b><br>'+esc(g.mobile)+'</td><td>'+esc(g.email||'-')+'</td><td>'+esc(g.idType)+'<br><b>'+esc(g.idNo)+'</b></td><td class="wrap">'+esc(g.address)+'</td><td>'+count+'</td><td><button onclick="selectGuestForBooking('+g.id+')">Use in Booking</button></td></tr>'}
pages.guests=function(){set('<div class="search-box"><b>🔎 Search Guest / Mobile / KYC</b><input id="guestSearch" placeholder="Name, mobile, email or ID number"><div class="small muted">Search is instant and does not reload the form.</div></div><div class="form"><h3>Add Guest / KYC</h3><div class="form-grid">'+field('gName','Full Name')+field('gMobile','Mobile')+field('gIdType','ID Type','text','Aadhaar')+field('gIdNo','ID Number')+field('gAddress','Full Address')+field('gEmail','Email','email','',false)+'</div><button class="primary" onclick="addGuest()">Save Guest / KYC</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Name / Mobile</th><th>Email</th><th>KYC</th><th>Address</th><th>Bookings</th><th></th></tr></thead><tbody id="guestRows"></tbody></table></div>');renderGuestRows('') ;$('guestSearch').oninput=e=>renderGuestRows(e.target.value)};
function renderGuestRows(q){const rows=db.guests.filter(g=>guestMatches(g,q)).map(guestRow).join('');if($('guestRows'))$('guestRows').innerHTML=rows||'<tr><td colspan="6">No guest found</td></tr>'}
function addGuest(){const n=$('gName').value.trim(),m=$('gMobile').value.trim(),idType=$('gIdType').value.trim(),idNo=$('gIdNo').value.trim(),address=$('gAddress').value.trim();if(!n||!m||!idType||!idNo||!address)return alert('Full Name, Mobile, ID Type, ID Number and Full Address are required.');if(db.guests.some(g=>g.mobile===m||g.idNo===idNo))return alert('Guest with same mobile or ID number already exists. Search and select that guest.');const g={id:nextId(db.guests),name:n,mobile:m,email:$('gEmail').value.trim(),idType,idNo,address};db.guests.push(g);save();alert('Guest/KYC saved.');pages.guests()}
function selectGuestForBooking(i){showPage('bookings');setTimeout(()=>{if($('bookingGuestSearch')){$('bookingGuestSearch').value=guest(i).mobile;renderBookingGuestResults(guest(i).mobile);chooseBookingGuest(i)}},0)}

function overlaps(b,ci,co,ignoreId){return num(b.id)!==num(ignoreId)&&!['CANCELLED','CHECKED_OUT'].includes(b.status)&&ci<b.checkOutDate&&co>b.checkInDate}
function availableRooms(ci,co,ignoreBookingId){return db.rooms.filter(r=>!['DIRTY','CLEANING','MAINTENANCE'].includes(r.status)&&!db.bookings.some(b=>num(b.roomId)===num(r.id)&&overlaps(b,ci,co,ignoreBookingId)))}
function invoiceTotals(b){const roomSub=num(b.roomSubtotal),food=foodTotal(b.id),other=num(b.otherCharges),discount=num(b.discount),taxRate=num(b.taxRate||db.settings.roomTaxRate||5),tax=Math.max(0,(roomSub+food+other-discount)*taxRate/100),total=Math.max(0,roomSub+food+other-discount)+tax,p=paid(b.id);return {roomSub,food,other,discount,tax,total,paid:p,balance:Math.max(0,total-p),taxRate}}
function refreshInvoice(b){const t=invoiceTotals(b),existing=db.invoices.find(x=>num(x.bookingId)===num(b.id));const x=existing||{id:nextId(db.invoices),no:(db.settings.prefix||'INV')+'-'+String(nextId(db.invoices)).padStart(5,'0'),bookingId:b.id,createdAt:now()};Object.assign(x,{guestId:b.guestId,roomId:b.roomId,roomSub:t.roomSub,food:t.food,other:t.other,discount:t.discount,tax:t.tax,total:t.total,paid:t.paid,balance:t.balance,status:t.balance<0.01?'PAID':t.paid>0?'PARTIAL':'DUE',updatedAt:now()});if(!existing)db.invoices.push(x);return x}
function renderAvailableRoomOptions(){const ci=$('bCheckIn')?.value,co=$('bCheckOut')?.value,cur=num($('bRoom')?.value),list=ci&&co&&nights(ci,co)>0?availableRooms(ci,co):[];if(!$('bRoom'))return;$('bRoom').innerHTML='<option value="">Select available room</option>'+list.map(r=>'<option value="'+r.id+'" '+(cur===r.id?'selected':'')+'>Room '+esc(r.no)+' · '+esc(r.type)+' · '+money(r.price)+'</option>').join('');bookingCalc()}
function bookingCalc(){const r=room(num($('bRoom')?.value)),n=nights($('bCheckIn')?.value,$('bCheckOut')?.value),sub=r?n*r.price:0,disc=num($('bDiscount')?.value),taxRate=num($('bTax')?.value),tax=Math.max(0,(sub-disc)*taxRate/100),total=Math.max(0,sub-disc)+tax,adv=num($('bAdvance')?.value);if($('bookingSummary'))$('bookingSummary').innerHTML='<div class="notice"><b>Room:</b> '+money(sub)+' · <b>GST:</b> '+money(tax)+' · <b>Invoice Total:</b> '+money(total)+' · <b>Paid now:</b> '+money(Math.min(adv,total))+' · <b>Balance:</b> '+money(Math.max(0,total-adv))+'</div>'}
function renderBookingGuestResults(q){const box=$('guestResults');if(!box)return;const query=(q||'').trim();if(!query){box.innerHTML='<span class="muted small">Type at least 2 characters/numbers to search guest by name, mobile or ID.</span>';return}const list=db.guests.filter(g=>guestMatches(g,query)).slice(0,10);box.innerHTML=(list.map(g=>'<button type="button" class="result-btn" onclick="chooseBookingGuest('+g.id+')">'+esc(g.name)+' · '+esc(g.mobile)+' · '+esc(g.idNo)+'</button>').join('')||'<span class="danger-text small">No matching guest.</span>')+' <button type="button" onclick="openNewGuestForm()">＋ New Guest / KYC</button>'}
function chooseBookingGuest(i){const g=guest(i);if(!g)return;$('bGuestId').value=g.id;$('bGuestSelected').innerHTML='<div class="selected-guest"><b>Selected:</b> '+esc(g.name)+' · '+esc(g.mobile)+'<br><span class="small">'+esc(g.idType)+' '+esc(g.idNo)+' · '+esc(g.address)+'</span></div>';if($('guestResults'))$('guestResults').innerHTML=''}
function openNewGuestForm(){const box=$('newGuestInline');if(box)box.classList.remove('hidden')}
function saveNewGuestFromBooking(){const n=$('ngName').value.trim(),m=$('ngMobile').value.trim(),it=$('ngIdType').value.trim(),ino=$('ngIdNo').value.trim(),ad=$('ngAddress').value.trim(),em=$('ngEmail').value.trim();if(!n||!m||!it||!ino||!ad)return alert('All Guest/KYC fields except email are required.');if(db.guests.some(g=>g.mobile===m||g.idNo===ino))return alert('Guest already exists. Search and select the existing guest.');const g={id:nextId(db.guests),name:n,mobile:m,email:em,idType:it,idNo:ino,address:ad};db.guests.push(g);save();chooseBookingGuest(g.id);$('newGuestInline').classList.add('hidden')}
function filterBookings(q){const body=$('bookingRows');if(!body)return;const rows=db.bookings.filter(b=>{const g=guest(b.guestId),r=room(b.roomId);return [b.no,b.status,b.checkInDate,b.checkOutDate,g?.name,g?.mobile,g?.idNo,r?.no].join(' ').toLowerCase().includes((q||'').toLowerCase())}).sort((a,b)=>b.id-a.id).map(bookingRow).join('');body.innerHTML=rows||'<tr><td colspan="8">No booking found</td></tr>'}
function bookingRow(b){const g=guest(b.guestId),r=room(b.roomId),t=invoiceTotals(b);return '<tr><td><b>'+esc(b.no)+'</b><br>'+esc(b.checkInDate)+' → '+esc(b.checkOutDate)+'</td><td>'+esc(g?.name||'')+'<br>'+esc(g?.mobile||'')+'<br><span class="small">'+esc(g?.idNo||'')+'</span></td><td>Room '+esc(r?.no||'')+'<br>'+statusBadge(b.status)+'</td><td>'+money(t.total)+'</td><td>'+money(t.paid)+'</td><td><b>'+money(t.balance)+'</b></td><td>'+statusBadge(invoiceFor(b.id)?.status||'DUE')+'</td><td><div class="actions"> <button onclick="openBooking('+b.id+')">Open</button>'+(b.status==='RESERVED'?'<button class="success" onclick="checkInBooking('+b.id+')">Check-in</button>':'')+(b.status==='CHECKED_IN'?'<button class="warning" onclick="checkOutBooking('+b.id+')">Check-out</button>':'')+(t.balance>0.01?'<button onclick="addPaymentToBooking('+b.id+')">Payment</button>':'')+'<button onclick="printInvoice('+refreshInvoice(b).id+')">Invoice</button></div></td></tr>'}
function invoiceFor(bid){return db.invoices.find(x=>num(x.bookingId)===num(bid))}
function renderExistingGuestResults(q){const box=$('existingGuestResults');if(!box)return;const query=(q||'').trim();if(!query){box.innerHTML='<span class="muted small">Search existing guest by name, mobile or ID number.</span>';return}const list=db.guests.filter(g=>guestMatches(g,query)).slice(0,10);box.innerHTML=(list.map(g=>'<button type="button" class="result-btn" onclick="chooseExistingBookingGuest('+g.id+')">'+esc(g.name)+' · '+esc(g.mobile)+' · '+esc(g.idNo)+'</button>').join('')||'<span class="danger-text small">No matching guest.</span>')}
function chooseExistingBookingGuest(i){const g=guest(i);if(!g)return;$('bGuestExistingId').value=g.id;$('bGuestName').value=g.name;$('bGuestMobile').value=g.mobile;$('bGuestIdType').value=g.idType;$('bGuestIdNo').value=g.idNo;$('bGuestAddress').value=g.address;$('bGuestEmail').value=g.email||'';['bGuestName','bGuestMobile','bGuestIdType','bGuestIdNo','bGuestAddress','bGuestEmail'].forEach(id=>$(id).setAttribute('readonly','readonly'));$('existingGuestSelected').innerHTML='<div class="selected-guest"><b>Existing guest selected:</b> '+esc(g.name)+' · '+esc(g.mobile)+'<br><span class="small">'+esc(g.idType)+' '+esc(g.idNo)+' · '+esc(g.address)+'</span></div>';$('existingGuestResults').innerHTML='';$('existingGuestSearch').value='';}
function clearExistingBookingGuest(){const g=guest(num($('bGuestExistingId')?.value));$('bGuestExistingId').value='';['bGuestName','bGuestMobile','bGuestIdType','bGuestIdNo','bGuestAddress','bGuestEmail'].forEach(id=>$(id).removeAttribute('readonly'));if(g){$('bGuestName').value='';$('bGuestMobile').value='';$('bGuestIdType').value='Aadhaar';$('bGuestIdNo').value='';$('bGuestAddress').value='';$('bGuestEmail').value='';}if($('existingGuestSelected'))$('existingGuestSelected').innerHTML='';if($('existingGuestSearch'))$('existingGuestSearch').value='';renderExistingGuestResults('')}
pages.bookings=function(){const ci=today(),co=new Date(Date.now()+86400000).toISOString().slice(0,10);set('<div class="card"><h3>Find Existing Guest</h3><input id="existingGuestSearch" placeholder="Name, mobile or ID number"><div id="existingGuestResults" class="results"></div><div id="existingGuestSelected"></div><button class="secondary" type="button" onclick="clearExistingBookingGuest()">＋ Use New Guest Instead</button></div><div class="form"><h3>New Booking</h3><div class="notice small"><b>New Guest / KYC is direct in this form.</b> Full Name, Mobile, ID Type, ID Number and Full Address are required. Existing guest search is kept separately above.</div><input type="hidden" id="bGuestExistingId" value=""><div class="form-grid">'+field('bGuestName','Full Name')+field('bGuestMobile','Mobile')+field('bGuestIdType','ID Type','text','Aadhaar')+field('bGuestIdNo','ID Number')+field('bGuestAddress','Full Address')+field('bGuestEmail','Email','email','',false)+'</div><div class="form-grid">'+field('bCheckIn','Check-in Date','date',ci)+field('bCheckOut','Check-out Date','date',co)+selectField('bRoom','Available Room','<option value="">Select available room</option>')+field('bAdults','Adults','number',1)+field('bAdvance','Advance / Paid Now','number',0)+field('bDiscount','Discount','number',0)+field('bTax','GST %','number',db.settings.roomTaxRate||5)+field('bNotes','Notes','text','',false)+'</div><div id="bookingSummary"></div><div class="sticky-actions"><button class="primary" onclick="createBooking()">Confirm Booking + Create Invoice</button></div></div><div class="search-box"><b>🔎 Search Booking / Guest / Mobile / Room / KYC</b><input id="bookingSearch" placeholder="Booking no, guest, mobile, room or ID number"><div class="small muted">Instant search. This search only filters the booking list.</div></div><div class="table-wrap"><table class="table"><thead><tr><th>Booking</th><th>Guest / KYC</th><th>Room / Status</th><th>Total</th><th>Paid</th><th>Balance</th><th>Invoice</th><th>Actions</th></tr></thead><tbody id="bookingRows"></tbody></table></div>');renderAvailableRoomOptions();renderExistingGuestResults('');filterBookings('');$('existingGuestSearch').oninput=e=>renderExistingGuestResults(e.target.value);$('bookingSearch').oninput=e=>filterBookings(e.target.value);$('bCheckIn').onchange=renderAvailableRoomOptions;$('bCheckOut').onchange=renderAvailableRoomOptions;$('bRoom').onchange=bookingCalc;$('bAdvance').oninput=bookingCalc;$('bDiscount').oninput=bookingCalc;$('bTax').oninput=bookingCalc}
function createBooking(){const existingId=num($('bGuestExistingId').value),n=$('bGuestName').value.trim(),m=$('bGuestMobile').value.trim(),idType=$('bGuestIdType').value.trim(),idNo=$('bGuestIdNo').value.trim(),address=$('bGuestAddress').value.trim(),email=$('bGuestEmail').value.trim(),ci=$('bCheckIn').value,co=$('bCheckOut').value,ri=num($('bRoom').value);if(!n||!m||!idType||!idNo||!address)return alert('Full Name, Mobile, ID Type, ID Number and Full Address are required.');if(!ci||!co||nights(ci,co)<=0)return alert('Valid dates required.');if(!ri)return alert('Available room select karein.');const r=room(ri);if(!availableRooms(ci,co).some(x=>x.id===ri))return alert('Room is not available for these dates.');let gid=existingId;if(gid&&!guest(gid))gid=0;if(!gid){if(db.guests.some(g=>g.mobile===m||g.idNo===idNo))return alert('Guest with same mobile or ID number already exists. Use the separate Existing Guest Search above.');const ng={id:nextId(db.guests),name:n,mobile:m,email,idType,idNo,address};db.guests.push(ng);gid=ng.id}const next=nextId(db.bookings),b={id:next,no:'BKG-'+String(next).padStart(5,'0'),guestId:gid,roomId:ri,checkInDate:ci,checkOutDate:co,adults:Math.max(1,num($('bAdults').value)),status:'RESERVED',roomSubtotal:nights(ci,co)*r.price,discount:Math.max(0,num($('bDiscount').value)),otherCharges:0,taxRate:Math.max(0,num($('bTax').value)),notes:$('bNotes').value,createdAt:now()};db.bookings.push(b);r.status='RESERVED';refreshInvoice(b);const total=invoiceTotals(b).total,advance=Math.min(Math.max(0,num($('bAdvance').value)),total);if(advance>0)db.payments.push({id:nextId(db.payments),bookingId:b.id,amount:advance,method:'CASH',reference:'',note:'Advance at booking',createdAt:now()});const x=refreshInvoice(b);save();alert('Booking '+b.no+' created. Invoice '+x.no+' ready.');openBooking(b.id)}
function openBooking(i){const b=booking(i),g=guest(b.guestId),r=room(b.roomId),t=invoiceTotals(b),x=refreshInvoice(b);const ps=paymentsFor(b.id).map(p=>'<tr><td>'+new Date(p.createdAt).toLocaleString()+'</td><td>'+esc(p.method)+'</td><td>'+esc(p.reference||'-')+'</td><td>'+esc(p.note||'')+'</td><td>'+money(p.amount)+'</td></tr>').join('');const upi=buildUPIUrl(x);set('<div class="card"><h3>Booking '+esc(b.no)+'</h3><p><b>Guest:</b> '+esc(g.name)+' · '+esc(g.mobile)+'<br><b>KYC:</b> '+esc(g.idType)+' '+esc(g.idNo)+'<br><b>Address:</b> '+esc(g.address)+'</p><p><b>Room:</b> '+esc(r.no)+' · '+esc(r.type)+' · '+money(r.price)+' / night<br><b>Stay:</b> '+b.checkInDate+' → '+b.checkOutDate+' ('+nights(b.checkInDate,b.checkOutDate)+' nights)</p><div class="grid">'+stat('Invoice Total',money(t.total))+stat('Paid',money(t.paid))+stat('Balance',money(t.balance))+stat('Invoice Status',x.status)+'</div><div class="actions">'+(b.status==='RESERVED'?'<button class="success" onclick="checkInBooking('+b.id+')">Check-in</button>':'')+(b.status==='CHECKED_IN'?'<button class="warning" onclick="checkOutBooking('+b.id+')">Check-out</button>':'')+(t.balance>0.01?'<button class="primary" onclick="addPaymentToBooking('+b.id+')">Add Payment</button><button class="primary" onclick="showPayQR('+x.id+')">Pay / QR</button>':'')+'<button onclick="printInvoice('+x.id+')">Print Invoice</button>'+(API_BASE&&t.balance>0.01?'<button class="primary" onclick="startInvoiceOnlinePayment('+b.id+')">Pay Balance Online</button>':'')+'<button class="secondary" onclick="showPage(\'bookings\')">Back</button></div></div><div class="card"><h3>Payment</h3><div class="form-grid">'+field('payAmount','Amount','number',t.balance)+selectField('payMethod','Method','<option>CASH</option><option>UPI</option><option>CARD</option><option>BANK TRANSFER</option><option>ONLINE</option>')+field('payReference','Transaction / UTR / Reference','text','',false)+field('payNote','Note','text','Payment received',false)+'</div><button class="primary" onclick="savePayment('+b.id+')">Save Payment</button><div class="small muted">Amount cannot exceed current balance.</div></div><div class="card"><h3>Pay Remaining by UPI QR</h3>'+renderQRBox(x)+'</div><div class="card"><h3>Payment History</h3><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Method</th><th>Reference</th><th>Note</th><th>Amount</th></tr>'+(ps||'<tr><td colspan="5">No payment yet</td></tr>')+'</table></div></div>')}
function checkInBooking(i){const b=booking(i);if(!b)return alert('Booking not found.');if(b.status!=='RESERVED')return alert('This booking is not in RESERVED status.');const r=room(b.roomId);b.status='CHECKED_IN';if(r)r.status='OCCUPIED';refreshInvoice(b);save();alert('Check-in completed for '+b.no+'.');openBooking(i)}
function checkOutBooking(i){const b=booking(i);if(!b)return alert('Booking not found.');if(b.status!=='CHECKED_IN')return alert('This booking is not checked in.');const r=room(b.roomId);b.status='CHECKED_OUT';if(r)r.status='DIRTY';refreshInvoice(b);save();alert('Check-out completed. Room marked DIRTY.');openBooking(i)}
function showPayQR(invoiceId){const x=invoice(invoiceId);if(!x)return alert('Invoice not found.');refreshInvoice(booking(x.bookingId));const fresh=invoice(invoiceId);if(!fresh||fresh.balance<=0.01)return alert('No balance due.');if(!db.settings.upiId)return alert('Hotel UPI ID set karein in Hotel Settings.');const u=buildUPIUrl(fresh);openQRModal('Invoice Payment '+fresh.no,num(fresh.balance),db.settings.upiId,u,'<p>Guest ko ye QR scan karke <b>'+money(fresh.balance)+'</b> pay karna hai.</p><p class="small">Payment receive hone ke baad Payment section mein UTR/reference save karein.</p>','<button class="success" onclick="closeQRModal()">Close</button>')}
function markRestaurantPaid(orderId){const o=db.orders.find(x=>num(x.id)===num(orderId));if(!o)return alert('Restaurant order not found.');if(o.paymentStatus==='PAID')return alert('This restaurant order is already marked PAID.');o.paymentStatus='PAID';o.chargeToRoom=false;db.payments.push({id:nextId(db.payments),bookingId:o.bookingId||null,amount:num(o.total),method:'UPI',reference:'Restaurant QR payment',note:'Restaurant payment received',source:'RESTAURANT',orderId:o.id,createdAt:now()});if(o.bookingId)refreshInvoice(booking(o.bookingId));posCart=[];save();alert('Restaurant payment marked as PAID. It will not be added to the room invoice.');pages.restaurant()}
function addPaymentToBooking(i){openBooking(i);setTimeout(()=>$('payAmount')?.focus(),0)}
function savePayment(i){const b=booking(i),t=invoiceTotals(b),a=num($('payAmount').value);if(a<=0)return alert('Enter payment amount.');if(a>t.balance+0.01)return alert('Payment cannot be greater than current balance '+money(t.balance));db.payments.push({id:nextId(db.payments),bookingId:b.id,amount:a,method:$('payMethod').value,reference:$('payReference').value.trim(),note:$('payNote').value.trim(),createdAt:now()});const x=refreshInvoice(b);save();alert('Payment saved. Remaining balance: '+money(x.balance));openBooking(i)}

async function startInvoiceOnlinePayment(bid){const b=booking(bid),x=refreshInvoice(b);if(!API_BASE)return alert('Online payment server is not connected.');if(x.balance<=0)return alert('No balance due.');try{const r=await fetch(API_BASE+'/api/payments/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:'GUEST-'+b.guestId,amount:x.balance,bookingNo:b.no,invoiceNo:x.no})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not create payment order');if(!window.Razorpay)throw new Error('Razorpay Checkout is unavailable.');const rp=new Razorpay({key:j.key,order_id:j.order.id,amount:j.order.amount,currency:j.order.currency,name:db.settings.name,description:'Hotel invoice '+x.no,prefill:{name:guest(b.guestId)?.name||'',contact:guest(b.guestId)?.mobile||'',email:guest(b.guestId)?.email||''},handler:async response=>{const vr=await fetch(API_BASE+'/api/payments/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...response,bookingNo:b.no,invoiceNo:x.no,amount:x.balance})});const v=await vr.json();if(v.paid){db.payments.push({id:nextId(db.payments),bookingId:bid,amount:x.balance,method:'ONLINE',reference:v.reference,note:'Razorpay online payment',createdAt:now()});refreshInvoice(b);save();alert('Online payment verified. Invoice updated.');openBooking(bid)}else alert(v.error||'Payment verification failed');}});rp.open()}catch(e){alert(e.message)}}
function buildUPIUrl(x){const s=db.settings,b=booking(x.bookingId);if(!s.upiId||x.balance<=0)return '';return 'upi://pay?pa='+encodeURIComponent(s.upiId)+'&pn='+encodeURIComponent(s.upiName||s.name||'Hotel')+'&am='+encodeURIComponent(x.balance.toFixed(2))+'&cu=INR&tn='+encodeURIComponent(x.no+' '+(guest(b.guestId)?.name||''))}
function qrImage(url){return url?'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=12&data='+encodeURIComponent(url):''}
function buildQRCanvas(containerId,text){const box=$(containerId);if(!box)return;box.innerHTML='';if(window.QRCode&&QRCode.toCanvas){const c=document.createElement('canvas');c.width=300;c.height=300;box.appendChild(c);QRCode.toCanvas(c,text,{width:300,margin:2},err=>{if(err)box.innerHTML='<img class="qr-fallback" src="'+qrImage(text)+'" alt="Payment QR">'});}else{box.innerHTML='<img class="qr-fallback" src="'+qrImage(text)+'" alt="Payment QR">'}}
function openQRModal(title,amount,upi,upiUrl,extraHtml,paidHtml){const m=$('qrModal'),c=$('qrModalContent');if(!m||!c)return;const safeTitle=esc(title),safeUpi=esc(upi||'');c.innerHTML='<div class="center"><h2>'+safeTitle+'</h2><div class="num" style="font-size:30px;font-weight:bold;margin:8px 0">'+money(amount)+'</div><div id="qrCanvas" class="qr-large"></div><p><b>'+safeUpi+'</b></p><p class="small muted">Scan this QR with any UPI app. Amount is fixed to the shown amount.</p>'+ (extraHtml||'') +'<div class="actions" style="justify-content:center"><a class="primary" style="display:inline-block;text-decoration:none;padding:10px 14px;border-radius:7px" href="'+esc(upiUrl)+'">Open UPI App</a>'+ (paidHtml||'') +'</div></div>';m.classList.remove('hidden');buildQRCanvas('qrCanvas',upiUrl)}
function closeQRModal(){$('qrModal')?.classList.add('hidden')}
function renderQRBox(x){if(!db.settings.upiId)return '<div class="warn">Set Hotel UPI ID in <b>Hotel Settings</b> to show a payment QR.</div>';if(x.balance<=0)return '<div class="notice"><b>PAID</b> — no balance remains, so no payment QR is needed.</div>';const u=buildUPIUrl(x);return '<div class="qr-box"><img class="qr-fallback" src="'+qrImage(u)+'" alt="UPI QR"><div><h3>Scan to pay '+money(x.balance)+'</h3><p>UPI ID: <b>'+esc(db.settings.upiId)+'</b></p><button class="primary" onclick="showPayQR('+x.id+')">Pay / Show QR</button></div></div>'}

pages.billing=function(){db.bookings.forEach(refreshInvoice);set('<div class="search-box"><b>🔎 Search Invoice / Booking / Guest / Mobile / Room / KYC</b><input id="billSearch" placeholder="Search..."><div class="small muted">One invoice per booking. Advance + later payments + restaurant charges are combined.</div></div><div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Guest</th><th>Room</th><th>Room</th><th>Food</th><th>GST</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr></thead><tbody id="billRows"></tbody></table></div>');renderBillRows('');$('billSearch').oninput=e=>renderBillRows(e.target.value)};
function renderBillRows(q){const body=$('billRows');if(!body)return;const rows=db.invoices.filter(x=>{const b=booking(x.bookingId),g=guest(x.guestId),r=room(x.roomId);return [x.no,b?.no,g?.name,g?.mobile,g?.idNo,r?.no,x.status].join(' ').toLowerCase().includes((q||'').toLowerCase())}).sort((a,b)=>b.id-a.id).map(x=>{const b=booking(x.bookingId),g=guest(x.guestId),r=room(x.roomId);return '<tr><td><b>'+esc(x.no)+'</b><br>'+esc(b?.no||'')+'</td><td>'+esc(g?.name||'')+'<br>'+esc(g?.mobile||'')+'</td><td>'+esc(r?.no||'')+'</td><td>'+money(x.roomSub)+'</td><td>'+money(x.food)+'</td><td>'+money(x.tax)+'</td><td><b>'+money(x.total)+'</b></td><td>'+money(x.paid)+'</td><td><b>'+money(x.balance)+'</b></td><td>'+statusBadge(x.status)+'</td><td><button onclick="openBooking('+b.id+')">Open</button>'+(x.balance>0.01?'<button class="primary" onclick="showPayQR('+x.id+')">Pay / QR</button>':'')+' <button onclick="printInvoice('+x.id+')">Print</button></td></tr>'}).join('');body.innerHTML=rows||'<tr><td colspan="11">No invoice found</td></tr>'}
function printInvoice(i){const x=invoice(i),b=booking(x.bookingId),g=guest(b.guestId),r=room(b.roomId),s=db.settings,ps=paymentsFor(b.id).map(p=>'<tr><td>'+new Date(p.createdAt).toLocaleString()+'</td><td>'+esc(p.method)+'</td><td>'+esc(p.reference||'-')+'</td><td>'+money(p.amount)+'</td></tr>').join('');const w=window.open('','_blank','width=950,height=900');if(!w)return alert('Allow popups for invoice printing.');const autoPrint='<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print()},500)}<\/scr'+'ipt>';w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(x.no)+'</title><style>body{font-family:Arial;padding:28px;color:#111}h1,h2,h3{margin:5px 0}table{width:100%;border-collapse:collapse;margin:14px 0}th,td{border:1px solid #ddd;padding:8px;text-align:left}th{background:#f3f4f6}.right{text-align:right}.muted{color:#666}.box{border:1px solid #ddd;padding:12px;border-radius:8px}</style></head><body><h1>'+esc(s.name)+'</h1><div>'+esc(s.address)+'<br>'+esc(s.phone)+'<br>GSTIN: '+esc(s.gstin)+'</div><hr><h2>FINAL / CURRENT INVOICE '+esc(x.no)+'</h2><div class="box"><b>Guest:</b> '+esc(g.name)+'<br><b>Mobile:</b> '+esc(g.mobile)+'<br><b>KYC:</b> '+esc(g.idType)+' '+esc(g.idNo)+'<br><b>Address:</b> '+esc(g.address)+'<br><b>Room:</b> '+esc(r.no)+'<br><b>Stay:</b> '+b.checkInDate+' → '+b.checkOutDate+'</div><table><tr><th>Description</th><th class="right">Amount</th></tr><tr><td>Room charges</td><td class="right">'+money(x.roomSub)+'</td></tr><tr><td>Restaurant / POS</td><td class="right">'+money(x.food)+'</td></tr><tr><td>Other charges</td><td class="right">'+money(x.other)+'</td></tr><tr><td>Discount</td><td class="right">-'+money(x.discount)+'</td></tr><tr><td>GST</td><td class="right">'+money(x.tax)+'</td></tr><tr><th>GRAND TOTAL</th><th class="right">'+money(x.total)+'</th></tr><tr><td>Total Paid</td><td class="right">'+money(x.paid)+'</td></tr><tr><th>BALANCE DUE</th><th class="right">'+money(x.balance)+'</th></tr></table><h3>Payment History</h3><table><tr><th>Date</th><th>Method</th><th>Reference</th><th>Amount</th></tr>'+(ps||'<tr><td colspan="4">No payments</td></tr>')+'</table><p>Status: <b>'+esc(x.status)+'</b></p><p class="muted">Generated: '+new Date().toLocaleString()+'</p>'+autoPrint+'</body></html>');w.document.close()}

pages.restaurant=function(){const menu=db.menu.map(m=>'<div class="menu-item"><b>'+esc(m.name)+'</b><div class="muted">'+esc(m.category)+'</div><h3>'+money(m.price)+'</h3><button onclick="addPOS('+m.id+')">Add</button></div>').join('');const cart=posCart.map((x,i)=>'<div class="pos-line"><span>'+esc(x.name)+'</span><input type="number" min="1" value="'+x.qty+'" onchange="posQty('+i+',this.value)"><b>'+money(x.price*x.qty)+'</b><button class="danger" onclick="posRemove('+i+')">×</button></div>').join('');const total=posCart.reduce((s,x)=>s+x.price*x.qty,0),bs=db.bookings.filter(b=>['RESERVED','CHECKED_IN'].includes(b.status)).map(b=>'<option value="'+b.id+'">'+esc(b.no)+' · Room '+esc(room(b.roomId)?.no||'')+' · '+esc(guest(b.guestId)?.name||'')+'</option>').join('');set('<div class="grid"><div class="card"><h3>Menu / POS</h3><div class="menu-grid">'+menu+'</div></div><div class="card"><h3>Current Order</h3><input id="posTable" placeholder="Table / Counter / Room"><select id="posBooking" style="margin-top:8px"><option value="">Standalone restaurant bill</option>'+bs+'</select><div style="margin-top:12px">'+(cart||'<div class="empty">Cart empty</div>')+'</div><hr><h2>'+money(total)+'</h2><div class="notice"><b>Payment choice:</b> If customer pays now, the food charge will NOT be added to the room invoice. If customer does not pay, choose <b>Charge to Room / Pay Later</b> and it will automatically be added to the guest invoice.</div><div class="actions"><button class="success" onclick="saveOrder(\'PAID\')">💳 Paid Now / Show QR</button><button class="primary" onclick="saveOrder(\'ROOM\')">🧾 Charge to Room / Pay Later</button></div><br><button onclick="clearCart()">Clear</button></div></div><br><div class="form"><h3>Add Menu Item</h3><div class="form-grid">'+field('mName','Item Name')+field('mCategory','Category','text','General')+field('mPrice','Price','number',100)+'</div><button onclick="addMenu()">Add Menu</button></div>')}
function addPOS(i){const m=db.menu.find(x=>num(x.id)===num(i)),x=posCart.find(x=>num(x.id)===num(i));if(x)x.qty++;else posCart.push({id:m.id,name:m.name,price:m.price,qty:1});pages.restaurant()}function posQty(i,v){posCart[i].qty=Math.max(1,num(v));pages.restaurant()}function posRemove(i){posCart.splice(i,1);pages.restaurant()}function clearCart(){posCart=[];pages.restaurant()}
function saveOrder(mode){if(!posCart.length)return alert('Add item first.');const bid=num($('posBooking').value)||null,total=posCart.reduce((s,x)=>s+x.price*x.qty,0);if(mode==='PAID'){if(!db.settings.upiId)return alert('Hotel UPI ID set karein in Hotel Settings before taking QR payment.');const pseudoId=nextId(db.orders);const temp={id:pseudoId,no:'POS-'+String(pseudoId).padStart(5,'0'),bookingId:bid,table:$('posTable').value||'Counter',items:clone(posCart),total,createdAt:now(),status:'POSTED',paymentStatus:'PENDING',chargeToRoom:false};db.orders.push(temp);save();showRestaurantPayQR(temp.id);return}db.orders.push({id:nextId(db.orders),no:'POS-'+String(nextId(db.orders)).padStart(5,'0'),bookingId:bid,table:$('posTable').value||'Counter',items:clone(posCart),total,createdAt:now(),status:'POSTED',paymentStatus:'DUE',chargeToRoom:!!bid});if(bid)refreshInvoice(booking(bid));posCart=[];save();alert(bid?'Restaurant charge added automatically to the same guest invoice as unpaid balance.':'Restaurant order saved.');pages.restaurant()}
function showRestaurantPayQR(orderId){const o=db.orders.find(x=>num(x.id)===num(orderId));if(!o)return;if(!db.settings.upiId)return alert('Hotel UPI ID set karein.');const u='upi://pay?pa='+encodeURIComponent(db.settings.upiId)+'&pn='+encodeURIComponent(db.settings.upiName||db.settings.name||'Hotel')+'&am='+encodeURIComponent(num(o.total).toFixed(2))+'&cu=INR&tn='+encodeURIComponent(o.no);const paidBtn='<button class="success" onclick="markRestaurantPaid('+o.id+');closeQRModal()">Payment Received / Paid</button>';openQRModal('Restaurant Payment '+o.no,num(o.total),db.settings.upiId,u,'<p>Customer: '+esc(o.table||'Counter')+'</p><p class="small">Customer scan kare. Payment receive hone ke baad <b>Payment Received / Paid</b> dabayein.</p>',paidBtn)}
function markRestaurantPaid(orderId){const o=db.orders.find(x=>num(x.id)===num(orderId));if(!o)return;o.paymentStatus='PAID';o.chargeToRoom=false;o.paidAt=now();db.payments.push({id:nextId(db.payments),bookingId:o.bookingId||null,orderId:o.id,amount:num(o.total),method:'UPI',reference:'',note:'Restaurant payment received at POS',source:'RESTAURANT',createdAt:now()});save();posCart=[];if(o.bookingId)refreshInvoice(booking(o.bookingId));alert('Restaurant payment marked PAID. It will not appear as an outstanding room charge, but it is counted in cash/income reports.');pages.restaurant()}

function reportDateFromIso(v){if(!v)return '';const d=new Date(v);if(Number.isNaN(d.getTime()))return '';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function reportInRange(v,from,to){const d=reportDateFromIso(v);return d&&d>=from&&d<=to}
function reportRangePreset(kind){const d=new Date();let from=new Date(d),to=new Date(d);if(kind==='yesterday'){from.setDate(from.getDate()-1);to=new Date(from)}else if(kind==='week'){from.setDate(from.getDate()-6)}else if(kind==='month'){from=new Date(d.getFullYear(),d.getMonth(),1)}else if(kind==='2months'){from=new Date(d.getFullYear(),d.getMonth()-1,1)}return {from:reportDateFromIso(from.toISOString()),to:reportDateFromIso(to.toISOString())}}
function setReportPreset(kind){const r=reportRangePreset(kind);$('repFrom').value=r.from;$('repTo').value=r.to;renderReportData()}
function renderReportData(){const from=$('repFrom')?.value||today(),to=$('repTo')?.value||today();if(from>to)return alert('From date cannot be after To date.');db.bookings.forEach(refreshInvoice);const pays=db.payments.filter(p=>reportInRange(p.createdAt,from,to)),exps=db.expenses.filter(e=>reportInRange(e.createdAt,from,to)),ins=db.invoices.filter(x=>{const b=booking(x.bookingId);return reportInRange(b?.createdAt||x.createdAt,from,to)});const incoming=pays.reduce((s,x)=>s+num(x.amount),0),outgoing=exps.reduce((s,x)=>s+num(x.amount),0),roomRev=ins.reduce((s,x)=>s+num(x.roomSub),0),food=db.orders.filter(o=>o.status!=='VOID'&&reportInRange(o.createdAt,from,to)).reduce((s,x)=>s+num(x.total),0),foodRoom=db.orders.filter(o=>o.status!=='VOID'&&o.chargeToRoom!==false&&o.paymentStatus!=='PAID'&&reportInRange(o.createdAt,from,to)).reduce((s,x)=>s+num(x.total),0),foodPaid=db.orders.filter(o=>o.status!=='VOID'&&o.paymentStatus==='PAID'&&reportInRange(o.createdAt,from,to)).reduce((s,x)=>s+num(x.total),0),tax=ins.reduce((s,x)=>s+num(x.tax),0),due=ins.reduce((s,x)=>s+num(x.balance),0),bookings=ins.length;const payRows=pays.slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).map(p=>{const b=booking(p.bookingId),g=b&&guest(b.guestId);return '<tr><td>'+esc(reportDateFromIso(p.createdAt))+'</td><td>'+esc(p.method)+'</td><td>'+esc(b?.no||'-')+'</td><td>'+esc(g?.name||'-')+'</td><td>'+money(p.amount)+'</td><td>'+esc(p.reference||'-')+'</td></tr>'}).join('');const expRows=exps.slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).map(e=>'<tr><td>'+esc(reportDateFromIso(e.createdAt))+'</td><td>'+esc(e.name)+'</td><td>'+money(e.amount)+'</td></tr>').join('');const days=[];const a=new Date(from+'T00:00:00'),z=new Date(to+'T00:00:00');for(let d=new Date(a);d<=z;d.setDate(d.getDate()+1)){const ds=reportDateFromIso(d.toISOString()),pi=pays.filter(p=>reportDateFromIso(p.createdAt)===ds).reduce((s,x)=>s+num(x.amount),0),eo=exps.filter(e=>reportDateFromIso(e.createdAt)===ds).reduce((s,x)=>s+num(x.amount),0);days.push('<tr><td>'+ds+'</td><td>'+money(pi)+'</td><td>'+money(eo)+'</td><td><b>'+money(pi-eo)+'</b></td></tr>')}$('reportCards').innerHTML='<div class="grid">'+stat('Period',from+' → '+to)+stat('आज/Period में आया',money(incoming))+stat('गया / Expenses',money(outgoing))+stat('Net Cash Flow',money(incoming-outgoing))+stat('Room Revenue',money(roomRev))+stat('Restaurant Revenue',money(food))+stat('Restaurant Paid at Counter',money(foodPaid))+stat('Restaurant on Room Invoice',money(foodRoom))+stat('GST',money(tax))+stat('Outstanding',money(due))+stat('Bookings',bookings)+'</div><br><div class="grid"><div class="card"><h3>Daily Cash Flow</h3><div class="table-wrap"><table class="table"><tr><th>Date</th><th>आया</th><th>गया</th><th>Net</th></tr>'+days.join('')+'</table></div></div><div class="card"><h3>Period Summary</h3><p><b>Incoming:</b> '+money(incoming)+'</p><p><b>Expenses:</b> '+money(outgoing)+'</p><p><b>Net:</b> '+money(incoming-outgoing)+'</p><p><b>Outstanding on selected invoices:</b> '+money(due)+'</p></div></div><br><div class="grid"><div class="card"><h3>Payments Received</h3><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Method</th><th>Booking</th><th>Guest</th><th>Amount</th><th>Reference</th></tr>'+(payRows||'<tr><td colspan="6">No payments in this period.</td></tr>')+'</table></div></div><div class="card"><h3>Expenses Paid</h3><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Expense</th><th>Amount</th></tr>'+(expRows||'<tr><td colspan="3">No expenses in this period.</td></tr>')+'</table></div></div></div>'}

function renewalQrUrl(days){const amount=days>100?num(db.settings.renewalYearly||1999):num(db.settings.renewalMonthly||299),customer=db.subscription.customerId||'HOTEL-DEMO',upi=db.settings.renewalUpiId||'9353689775@upi',name=db.settings.renewalUpiName||'Hotel Renewal';return 'upi://pay?pa='+encodeURIComponent(upi)+'&pn='+encodeURIComponent(name)+'&am='+encodeURIComponent(amount.toFixed(2))+'&cu=INR&tn='+encodeURIComponent('RENEW '+customer+' '+days+'D')}

let licensePoll=null;
async function checkLicenseNow(silent=false){const base=(localStorage.getItem('HOTEL_API_BASE')||API_BASE||'').replace(/\/$/,'');if(!base){applyLicenseGate(true);if(!silent)alert('API Base URL set karein.');return null}try{const r=await fetch(base+'/api/subscription/status/'+encodeURIComponent(db.subscription.customerId||'HOTEL-DEMO'));const j=await r.json();if(j.subscription){db.subscription=Object.assign({},db.subscription,j.subscription);save()}applyLicenseGate(!!j.active);if(!silent)pages.subscription();return j}catch(e){applyLicenseGate(false);if(!silent)alert('License server se connection nahi hua: '+e.message);return null}}
function startLicensePolling(){if(licensePoll)clearInterval(licensePoll);if((localStorage.getItem('HOTEL_API_BASE')||API_BASE)){licensePoll=setInterval(()=>checkLicenseNow(true),10000)}}
pages.subscription=function(){const s=db.subscription,expired=s.expiry&&new Date(s.expiry)<new Date(),apiBase=localStorage.getItem('HOTEL_API_BASE')||API_BASE||'',upi=db.settings.renewalUpiId||'9353689775@upi',monthly=num(db.settings.renewalMonthly||299),yearly=num(db.settings.renewalYearly||1999);set('<div class="card"><h3>Subscription / License</h3><div class="grid">'+stat('Status',expired?'DEACTIVE':s.status)+stat('Plan',s.plan)+stat('Expiry',s.expiry?new Date(s.expiry).toLocaleString():'Not active')+stat('Customer ID',s.customerId||'HOTEL-DEMO')+'</div><div class="notice"><b>Renewal UPI:</b> '+esc(upi)+'<br><b>Auto activation:</b> Online gateway payment + verified webhook ke baad server license ko ACTIVE karega. App ghar se status check/poll karega; hotel par physically jana zaroori nahi.</div><div class="form"><h3>Renewal Setup</h3><div class="form-grid">'+field('subCustomer','Customer / License ID','text',s.customerId||'HOTEL-DEMO')+field('subUpi','Renewal UPI ID','text',upi)+field('subUpiName','Renewal Payee Name','text',db.settings.renewalUpiName||'Hotel Renewal')+field('subMonthly','30 Days Price','number',monthly)+field('subYearly','1 Year Price','number',yearly)+field('subApi','Online Server API URL','url',apiBase,false)+'</div><div class="small muted">Razorpay Secret yahan nahi dalein. Secret sirf server <b>.env</b> mein rahega.</div><div class="actions"><button class="primary" onclick="saveSubscriptionSetup()">Save Renewal Setup</button><button onclick="checkLicenseNow(false)">Check / Verify License Online</button></div><div class="notice small"><b>Webhook URL:</b> '+esc(apiBase?apiBase+'/webhooks/razorpay':'YOUR-HTTPS-SERVER/webhooks/razorpay')+'<br>Razorpay Dashboard → Settings → Webhooks mein ye public HTTPS URL set karein.</div></div><div class="grid"><div class="card"><h3>30 Days — ₹'+monthly.toFixed(2)+'</h3><div class="qr-box"><div id="renewQr30" class="qr-small"></div><div><p>Direct UPI: <b>'+esc(upi)+'</b></p><button class="primary" onclick="startOnlineRenewal(30)">Pay 30 Days Online</button><button onclick="showRenewalQR(30)">Show QR</button></div></div></div><div class="card"><h3>1 Year — ₹'+yearly.toFixed(2)+'</h3><div class="qr-box"><div id="renewQr365" class="qr-small"></div><div><p>Direct UPI: <b>'+esc(upi)+'</b></p><button class="primary" onclick="startOnlineRenewal(365)">Pay 1 Year Online</button><button onclick="showRenewalQR(365)">Show QR</button></div></div></div></div><div class="actions"><button class="secondary" onclick="demoRenew(30)">Demo Renew (testing only)</button></div><div class="small muted">Direct UPI QR is a payment fallback. Automatic activation is guaranteed only when the payment goes through the configured gateway/payment link and the webhook reaches the public HTTPS server.</div></div>');setTimeout(()=>{buildQRCanvas('renewQr30',renewalQrUrl(30));buildQRCanvas('renewQr365',renewalQrUrl(365));startLicensePolling()},0)}
function saveSubscriptionSetup(){db.subscription.customerId=$('subCustomer').value.trim()||'HOTEL-DEMO';db.settings.renewalUpiId=$('subUpi').value.trim()||'9353689775@upi';db.settings.renewalUpiName=$('subUpiName').value.trim()||'Hotel Renewal';db.settings.renewalMonthly=num($('subMonthly').value)||299;db.settings.renewalYearly=num($('subYearly').value)||1999;const api=$('subApi').value.trim().replace(/\/$/,'');if(api)localStorage.setItem('HOTEL_API_BASE',api);else localStorage.removeItem('HOTEL_API_BASE');save();alert('Renewal setup saved.');pages.subscription()}
function showRenewalQR(days){const amount=days>100?num(db.settings.renewalYearly||1999):num(db.settings.renewalMonthly||299);const u=renewalQrUrl(days);openQRModal((days>100?'1 Year':'30 Days')+' Renewal',amount,db.settings.renewalUpiId||'9353689775@upi',u,'<p>Customer / License ID: <b>'+esc(db.subscription.customerId||'HOTEL-DEMO')+'</b></p><p class="small">Direct UPI payment ko automatic verify karne ke liye payment gateway webhook configure karein.</p>','<button class="primary" onclick="checkLicenseNow(false)">Check License Status</button>')}
async function startOnlineRenewal(days){const base=(localStorage.getItem('HOTEL_API_BASE')||API_BASE||'').replace(/\/$/,'');if(!base)return alert('Renewal Setup mein Online Server API URL set karein.');try{const customerId=db.subscription.customerId||'HOTEL-DEMO',amount=days>100?num(db.settings.renewalYearly||1999):num(db.settings.renewalMonthly||299),r=await fetch(base+'/api/subscription/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId,days})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Order creation failed');if(j.paymentLink){openQRModal('Online Renewal',amount,db.settings.renewalUpiId||'9353689775@upi',j.paymentLink,'<p>Payment link QR generated by server. Pay karte hi webhook se license update hoga.</p>','<button class="primary" onclick="checkLicenseNow(false)">Check / Verify Now</button>');return}if(!window.Razorpay)throw new Error('Razorpay Checkout script is unavailable.');const rp=new Razorpay({key:j.key,order_id:j.order.id,amount:j.order.amount,currency:j.order.currency,name:db.settings.name,description:'Hotel software renewal',handler:async response=>{const vr=await fetch(base+'/api/subscription/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(response)});const v=await vr.json();if(v.active){db.subscription=Object.assign({},db.subscription,v.subscription);save();alert('Payment verified. Subscription automatically activated.');pages.subscription()}else alert(v.error||'Verification pending.')}});rp.open()}catch(e){alert(e.message)}}
function demoRenew(d){const x=new Date();x.setDate(x.getDate()+d);db.subscription={status:'ACTIVE',plan:d>100?'Yearly':'Monthly',expiry:x.toISOString(),customerId:db.subscription.customerId||'DEMO-'+Date.now(),renewalUpiId:db.settings.renewalUpiId||'9353689775@upi'};save();pages.subscription()}

pages.renewals=function(){const api=localStorage.getItem('HOTEL_API_BASE')||API_BASE||'';set('<div class="card"><h3>🔔 Renewal Requests</h3><p class="muted">Customer payment ke baad UTR/Transaction ID submit karega. Aap apne UPI/bank statement mein UTR check karke yahin se manually Activate kar sakte hain.</p><div class="form-grid">'+field('renewAdminToken','Admin Activation Token','password','')+field('renewApi','Online Server API URL','url',api,false)+'</div><div class="actions"><button class="primary" onclick="loadRenewalRequests()">Refresh Requests</button><button onclick="openPublicRenewalPage()">Customer Renewal Page</button></div><div id="renewalRequestsBox" class="table-wrap"><div class="empty">Refresh Requests dabaiye.</div></div></div>');loadRenewalRequests()}
async function loadRenewalRequests(){const box=$('renewalRequestsBox');if(!box)return;const base=(localStorage.getItem('HOTEL_API_BASE')||API_BASE||'').replace(/\/$/,'');if(!base){box.innerHTML='<div class="warn">Online Server API URL set karein. Customer renewal requests online tabhi milengi.</div>';return}try{const token=$('renewAdminToken')?.value.trim()||'';if(!token){box.innerHTML='<div class="warn">Renewal requests dekhne ke liye Admin Activation Token enter karein.</div>';return}const r=await fetch(base+'/api/renewal-requests',{headers:{'X-Admin-Token':token}});const j=await r.json();if(!r.ok)throw new Error(j.error||'Failed');const rows=(j.requests||[]).map(x=>'<tr><td><b>'+esc(x.customerId)+'</b><br>'+esc(x.customerName||'-')+'</td><td>'+esc(x.mobile||'-')+'</td><td>'+esc(x.plan||'-')+'<br>'+money(x.amount)+'</td><td><b>'+esc(x.utr||'-')+'</b><br><span class="small">'+esc(x.paidAt||x.createdAt||'')+'</span></td><td>'+statusBadge(x.status||'PENDING')+'</td><td>'+(x.status==='PENDING'?'<button class="success" onclick="verifyRenewalRequest(\''+esc(x.id)+'\')">Verify & Activate</button>':'<span class="small">'+esc(x.verifiedAt||'Verified')+'</span>')+'</td></tr>').join('');box.innerHTML='<table class="table"><thead><tr><th>Customer / License</th><th>Mobile</th><th>Plan / Amount</th><th>UTR / Payment Time</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6">No renewal requests.</td></tr>')+'</tbody></table>'}catch(e){box.innerHTML='<div class="bad">Could not load requests: '+esc(e.message)+'</div>'}}
async function verifyRenewalRequest(id){const token=$('renewAdminToken')?.value.trim();if(!token)return alert('Admin Activation Token enter karein.');const base=(localStorage.getItem('HOTEL_API_BASE')||API_BASE||'').replace(/\/$/,'');if(!base)return alert('Online Server API URL set karein.');if(!confirm('UTR ko apne bank/UPI statement mein verify kar liya hai?\n\nVerify karne ke baad license automatically ACTIVE ho jayega.'))return;try{const r=await fetch(base+'/api/renewal-requests/'+encodeURIComponent(id)+'/verify',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':token}});const j=await r.json();if(!r.ok)throw new Error(j.error||'Verification failed');alert('License ACTIVE. Expiry: '+new Date(j.subscription.expiry).toLocaleString());loadRenewalRequests();checkLicenseNow(false)}catch(e){alert(e.message)}}
function openPublicRenewalPage(){const base=(localStorage.getItem('HOTEL_API_BASE')||API_BASE||'').replace(/\/$/,'');if(base)window.open(base+'/renewal.html?customerId='+encodeURIComponent(db.subscription.customerId||'HOTEL-DEMO'),'_blank');else alert('Online Server API URL set karein. Public renewal page server par available hoga.')}

pages.settings=function(){const s=db.settings,api=localStorage.getItem('HOTEL_API_BASE')||API_BASE||'';set('<div class="form"><h3>Hotel Settings</h3><div class="form-grid">'+field('sName','Hotel Name','text',s.name)+field('sPhone','Phone','text',s.phone)+field('sGSTIN','GSTIN','text',s.gstin)+field('sGST','Default GST %','number',s.gstRate)+field('sRoomTax','Room GST %','number',s.roomTaxRate)+field('sFoodTax','Food GST %','number',s.foodTaxRate)+field('sPrefix','Invoice Prefix','text',s.prefix)+field('sUPI','Hotel UPI ID','text',s.upiId,false)+field('sUPIName','UPI Payee Name','text',s.upiName,false)+field('sRenewalUPI','Renewal UPI ID','text',s.renewalUpiId||'9353689775@upi')+field('sRenewalUPIName','Renewal Payee Name','text',s.renewalUpiName||'Hotel Renewal')+'</div><label>Address</label><textarea id="sAddress">'+esc(s.address)+'</textarea><div class="actions"><button class="primary" onclick="saveSettings()">Save Settings</button><button onclick="showPage(\'subscription\')">Renewal / Payment Setup</button><button onclick="backup()">Backup</button><button onclick="document.getElementById(\'restore\').click()">Restore</button><input id="restore" type="file" accept=".json" style="display:none" onchange="restore(event)"></div></div><div class="form"><h3>Online Payment Connection</h3><div class="form-grid">'+field('apiBase','Online Server API URL','url',api,false)+field('publicKeyInfo','Razorpay Key ID','text','Server se automatically milega',false)+'</div><div class="notice small">Example: <b>https://your-domain.com</b>. Webhook must be public HTTPS. Never put Razorpay secret in this page, SPCK, or GitHub.</div><div class="actions"><button class="primary" onclick="saveApiBase()">Save API URL</button><button onclick="checkServerHealth()">Test Connection</button></div><div id="healthResult" class="small"></div></div>')}
function saveSettings(){Object.assign(db.settings,{name:$('sName').value||'My Hotel',phone:$('sPhone').value,gstin:$('sGSTIN').value,gstRate:num($('sGST').value),roomTaxRate:num($('sRoomTax').value),foodTaxRate:num($('sFoodTax').value),prefix:$('sPrefix').value||'INV',upiId:$('sUPI').value.trim(),upiName:$('sUPIName').value.trim(),renewalUpiId:$('sRenewalUPI').value.trim()||'9353689775@upi',renewalUpiName:$('sRenewalUPIName').value.trim()||'Hotel Renewal',address:$('sAddress').value});save();$('brandName').textContent=db.settings.name;alert('Settings saved');pages.settings()}
function saveApiBase(){const v=$('apiBase').value.trim().replace(/\/$/,'');if(v)localStorage.setItem('HOTEL_API_BASE',v);else localStorage.removeItem('HOTEL_API_BASE');alert('Online server URL saved.');pages.settings()}
async function checkServerHealth(){const base=(localStorage.getItem('HOTEL_API_BASE')||API_BASE||'').replace(/\/$/,'');if(!base)return alert('Online Server API URL set karein.');try{const r=await fetch(base+'/api/health');const j=await r.json();$('healthResult').innerHTML='<span class="ok">Connected. Payment gateway: <b>'+esc(j.paymentConfigured?'CONFIGURED':'NOT CONFIGURED')+'</b></span>'}catch(e){$('healthResult').innerHTML='<span class="bad">Connection failed: '+esc(e.message)+'</span>'}}
