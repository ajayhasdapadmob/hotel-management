<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hotel Software Renewal</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0;padding:20px;color:#18202a}.wrap{max-width:720px;margin:auto}.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 5px 25px #0001;margin-bottom:18px}h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{font-weight:700;display:block;margin:8px 0 5px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd4df;border-radius:8px}button{border:0;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:700}.primary{background:#2563eb;color:#fff}.secondary{background:#e9eef6}.plan{border:1px solid #dbe3ef;border-radius:10px;padding:14px}.plan.active{border:2px solid #2563eb}.qr{text-align:center;margin-top:12px}.qr canvas{max-width:240px}.notice{background:#eef6ff;padding:12px;border-radius:8px}.ok{color:#087a3d;font-weight:700}.bad{color:#b42318;font-weight:700}.small{font-size:13px;color:#667085}</style>
</head><body><div class="wrap">
<div class="card"><h1>🔐 Hotel Software Renewal</h1><p class="small">Payment karke UTR / Transaction ID submit karein. Admin payment verify karke software ko ACTIVE karega.</p><div class="notice"><b>Renewal UPI:</b> <span id="upi">9353689775@upi</span><br><b>License ID:</b> <span id="cid">HOTEL-DEMO</span></div></div>
<div class="card"><h2>1. Renewal Plan</h2><div class="grid"><div id="p30" class="plan active"><h3>30 Days — ₹299</h3><div id="qr30" class="qr"></div><button class="secondary" onclick="selectPlan(30)">Select 30 Days</button></div><div id="p365" class="plan"><h3>1 Year — ₹1999</h3><div id="qr365" class="qr"></div><button class="secondary" onclick="selectPlan(365)">Select 1 Year</button></div></div></div>
<div class="card"><h2>2. Payment ke baad details submit karein</h2><div class="grid"><div><label>Customer / License ID</label><input id="customerId"></div><div><label>Customer Name</label><input id="customerName"></div><div><label>Mobile</label><input id="mobile" inputmode="numeric"></div><div><label>Selected Plan</label><select id="plan" onchange="selectPlan(Number(this.value))"><option value="30">30 Days — ₹299</option><option value="365">1 Year — ₹1999</option></select></div><div><label>UPI Transaction ID / UTR *</label><input id="utr" placeholder="e.g. 123456789012" required></div><div><label>Payment Date/Time</label><input id="paidAt" type="datetime-local"></div></div><br><button class="primary" onclick="submitRequest()">Submit Renewal Request</button><div id="result" style="margin-top:12px"></div></div>
</div>
<script>
const qs=new URLSearchParams(location.search);const API=(qs.get('server')||location.origin).replace(/\/$/,'');let days=30;
const cid=qs.get('customerId')||'HOTEL-DEMO';document.getElementById('cid').textContent=cid;document.getElementById('customerId').value=cid;document.getElementById('paidAt').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
function upiUrl(d){const amount=d>100?1999:299;return 'upi://pay?pa=9353689775%40upi&pn=Hotel%20Renewal&am='+amount+'&cu=INR&tn='+encodeURIComponent('Renewal '+cid)}
function makeQR(id,url){const el=document.getElementById(id);if(window.QRCode&&QRCode.toCanvas){el.innerHTML='';const c=document.createElement('canvas');el.appendChild(c);QRCode.toCanvas(c,url,{width:220,margin:2})}}
makeQR('qr30',upiUrl(30));makeQR('qr365',upiUrl(365));
function selectPlan(d){days=d;document.getElementById('plan').value=String(d);document.getElementById('p30').classList.toggle('active',d===30);document.getElementById('p365').classList.toggle('active',d===365)}
async function submitRequest(){const out=document.getElementById('result');const body={customerId:document.getElementById('customerId').value.trim(),customerName:document.getElementById('customerName').value.trim(),mobile:document.getElementById('mobile').value.trim(),days:Number(document.getElementById('plan').value),amount:Number(document.getElementById('plan').value)>100?1999:299,utr:document.getElementById('utr').value.trim(),paidAt:document.getElementById('paidAt').value};if(!body.customerId||!body.customerName||!body.mobile||!body.utr){out.innerHTML='<span class="bad">Customer ID, Name, Mobile aur UTR required hai.</span>';return}try{const r=await fetch(API+'/api/renewal-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');out.innerHTML='<span class="ok">Renewal request submitted successfully. Aapka UTR admin verify karega aur verify hote hi license ACTIVE ho jayega.</span>'}catch(e){out.innerHTML='<span class="bad">'+e.message+'</span>'}}
</script></body></html>
